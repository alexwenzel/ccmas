# Workflow-Vertrag (schema_version 1). Aufbau und Prüfungen: docs/architecture/workflow-rules.md.
# Der Vertrag wählt aus den Rollenregeln (rules/roles.yaml) aus; er kann sie nicht erweitern und
# setzt weder Worker-Limit, Integrationsmodus, Policy-Profil, Berechtigungen noch Zielbranch.
# Fragenweg Worker, Supervisor, CCMAS-Zentrale, Supervisor, zuständiger Worker; die Zentrale ist der
# primäre Antwortort, Asana dokumentiert ergänzend (im Entwicklungsprojekt bis dahin Regel 7.8). Keine
# Antwort ist keine Freigabe. uses_skills nennt Wissen für die Schreibabsicht (Asana, Vault); die
# Ausführung läuft über die kontrollierten Adapter.
schema_version: 1
skill: ccmas-antworten-abholen
role: question_handler
uses_skills: [ccmas-asana-ticket, ccmas-obsidian-seite]
inputs:
  - {name: question, required: true, description: "Offene Frage mit ID, Auftrag, Ausführung, Kontext und Empfehlung"}
  - {name: answers, required: true, description: "Eingegangene Antworten aus der Zentrale und ergänzend aus Asana"}
  - {name: work_order, required: true, description: "Blockierter Auftrag, dem die Antwort zugeordnet wird"}
preconditions: []
scope:
  within_work_order: true
  allowed: [read_vault, write_asana, write_vault]
  forbidden: [read_repo, write_worktree, run_checks, commit, push, open_pr, merge, start_agents, change_platform_limits]
result:
  format: answer_report
checks:
  - {id: answer_assigned, description: "Die Antwort gehört zur Frage und zum blockierten Auftrag, ist aktuell und widerspruchsfrei"}
  - {id: not_silent_approval, description: "Fehlende Antwort wurde nicht als Freigabe gedeutet"}
  - {id: documented, description: "Die übernommene Entscheidung ist im Ticket und, wo dauerhaft, im Wissensstand nachgezogen"}
blockers:
  - {id: answer_missing, description: "Es liegt keine Antwort vor", result: no_answer}
  - {id: answer_unclear, description: "Die Antwort ist unklar, veraltet oder widersprüchlich", result: answer_unclear}
completion_criteria:
  - "Jede übernommene Antwort ist genau einer Frage und einem blockierten Auftrag zugeordnet"
  - "Unklares wurde nicht angenommen, sondern als neue Rückfrage formuliert"
  - "Weder Auftragsmodus noch Umfang noch Berechtigungen wurden durch die Antwort erweitert"
  - "Die Antwort geht an den zuständigen Worker zurück; der Skill hat weder eine Ausführung gestartet noch gemergt oder gepusht"
results:
  answer_assigned:
    followups:
      - {action: implementation, role: implementer}
      - {action: concept_work, role: concept}
  answer_unclear:
    followups:
      - {action: ask_question}
  no_answer:
    followups:
      - {action: wait}
