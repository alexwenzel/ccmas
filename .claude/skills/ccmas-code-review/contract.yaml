# Workflow-Vertrag (schema_version 1). Aufbau und Prüfungen: docs/architecture/workflow-rules.md.
# Der Vertrag wählt aus den Rollenregeln (rules/roles.yaml) aus; er kann sie nicht erweitern und
# setzt weder Worker-Limit, Integrationsmodus, Policy-Profil, Berechtigungen noch Zielbranch.
schema_version: 1
skill: ccmas-code-review
role: reviewer
uses_skills: []
inputs:
  - {name: work_order, required: true, description: "Arbeitsauftrag mit Ziel und Akzeptanzkriterien"}
  - {name: worktree, required: true, description: "Pfad des vorbereiteten Worktrees, exklusiv für diese Prüfung reserviert"}
  - {name: commit, required: true, description: "Zu prüfender Commit (vollständiger Hash)"}
  - {name: base, required: true, description: "Vergleichsbasis, immer origin/develop"}
  - {name: concept_version, required: true, description: "Freigegebene Konzeptversion, gegen die geprüft wird; ohne Konzeptbezug des Auftrags die feste Kennung kein-konzept"}
  - {name: acceptance_criteria, required: true, description: "Akzeptanzkriterien des Auftrags"}
  - {name: implementer_execution_id, required: true, description: "Ausführung der Implementierung, zum Nachweis der Unabhängigkeit"}
  - {name: implementer_report, required: false, description: "Bericht des Implementierers mit Prüfergebnissen und offenen Punkten"}
preconditions: [work_order_completed]
scope:
  within_work_order: true
  allowed: [read_repo, read_vault, run_checks]
  forbidden: [write_worktree, commit, push, open_pr, merge, write_asana, write_vault, start_agents, change_platform_limits]
result:
  format: review_report
checks:
  - {id: stand_unique, description: "HEAD entspricht dem genannten Commit, der Arbeitsbaum ist sauber, die Basis ist origin/develop"}
  - {id: diff_read, description: "Diff gegen die Basis und der betroffene Bestandscode sind gelesen"}
  - {id: criteria_matched, description: "Jedes Akzeptanzkriterium ist mit Beleg erfüllt oder als nicht erfüllt geführt"}
  - {id: decisions_respected, description: "Festgelegte Produktentscheidungen, Grenzen und Konzeptversion sind eingehalten"}
  - {id: checks_run, description: "Die Prüfungen des Repos sind selbst ausgeführt, mit Befehl und Ergebnis"}
  - {id: tests_meaningful, description: "Die Tests prüfen Verhalten und Fehlerfälle und spiegeln nicht nur die Implementierung"}
blockers:
  - {id: stand_not_unique, description: "Commit, Worktree oder Konzeptversion sind nicht eindeutig oder der Arbeitsbaum ist nicht sauber", result: findings}
  - {id: checks_not_runnable, description: "Eine verpflichtende Prüfung lässt sich nicht ausführen", result: findings}
  - {id: evidence_missing, description: "Ein Kriterium ist nicht belegt; Unbelegtes gilt als nicht erfüllt", result: findings}
completion_criteria:
  - "Das Urteil FREIGEGEBEN oder BEFUNDE steht für genau den genannten Commit und die genannte Konzeptversion"
  - "Jede Prüfung ist mit Befehl und wörtlich zusammengefasstem Ergebnis belegt"
  - "Jeder Befund hat Schwere (blocker, major, minor), Ort und erwartete Korrektur"
  - "Es wurde nichts geändert, committet oder gepusht"
results:
  approved:
    verdict: FREIGEGEBEN
    followups:
      - {action: request_integration, preconditions: [review_approved]}
  findings:
    verdict: BEFUNDE
    followups:
      - {action: implementation, role: implementer}
