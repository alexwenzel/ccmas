# Workflow-Vertrag (schema_version 1). Aufbau und Prüfungen: docs/architecture/workflow-rules.md.
# Der Vertrag wählt aus den Rollenregeln (rules/roles.yaml) aus; er kann sie nicht erweitern und
# setzt weder Worker-Limit, Integrationsmodus, Policy-Profil, Berechtigungen noch Zielbranch.
# Zielbild: Der Implementierer arbeitet im ihm zugewiesenen Worktree; Push, PR und Merge führt die
# Plattform erst nach dem unabhängigen Review aus (Aktion request_integration).
schema_version: 1
skill: ccmas-feature-parallel
role: implementer
uses_skills: []
inputs:
  - {name: work_order, required: true, description: "Arbeitsauftrag mit Ziel, Akzeptanzkriterien und erlaubtem Umfang"}
  - {name: worktree, required: true, description: "Zugewiesener Worktree auf eigenem Branch von develop"}
  - {name: concept_version, required: true, description: "Freigegebene Konzeptversion, auf der die Umsetzung beruht"}
  - {name: findings, required: false, description: "Befunde eines Reviews, wenn nachgebessert wird"}
preconditions: [concept_version_approved, capacity_available]
scope:
  within_work_order: true
  allowed: [read_repo, read_vault, write_worktree, run_checks, commit]
  forbidden: [push, open_pr, merge, write_asana, write_vault, start_agents, change_platform_limits]
result:
  format: work_report
checks:
  - {id: tests_first, description: "Neue Logik hat Tests, Fehler haben einen Regressionstest, Tests spiegeln nicht nur die Implementierung"}
  - {id: repo_checks, description: "Alle Prüfungen des Repos laufen mit echtem Ergebnis, bevor der Stand gemeldet wird"}
  - {id: criteria_matched, description: "Jedes Akzeptanzkriterium ist mit Beleg abgeglichen"}
  - {id: clean_commit, description: "Nur zugehörige Dateien sind committet, der Arbeitsbaum ist danach sauber"}
blockers:
  - {id: concept_unclear, description: "Das Konzept lässt eine Frage offen, die den Lösungsweg ändert", result: implementation_blocked}
  - {id: scope_exceeded, description: "Die Aufgabe verlangt mehr als der Auftrag erlaubt", result: implementation_blocked}
  - {id: checks_failing, description: "Eine verpflichtende Prüfung lässt sich nicht grün bekommen", result: implementation_blocked}
completion_criteria:
  - "Der Änderungsstand ist committet und im zugewiesenen Worktree eindeutig bestimmt (Commit-Hash)"
  - "Testergebnisse und offene Punkte sind ehrlich berichtet; Nicht-Ausführbares ist benannt"
  - "Nichts wurde gepusht, gemergt oder außerhalb des Auftrags verändert"
results:
  implemented:
    followups:
      - {action: review, role: reviewer, preconditions: [work_order_completed]}
  implementation_blocked:
    followups:
      - {action: ask_question}
