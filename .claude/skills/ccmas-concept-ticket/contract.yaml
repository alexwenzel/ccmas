# Workflow-Vertrag (schema_version 1). Aufbau und Prüfungen: docs/architecture/workflow-rules.md.
# Der Vertrag wählt aus den Rollenregeln (rules/roles.yaml) aus; er kann sie nicht erweitern und
# setzt weder Worker-Limit, Integrationsmodus, Policy-Profil, Berechtigungen noch Zielbranch.
schema_version: 1
skill: ccmas-concept-ticket
role: concept
uses_skills: [ccmas-asana-ticket, ccmas-obsidian-seite]
inputs:
  - {name: work_order, required: true, description: "Konzeptauftrag mit Ziel, Umfang und Abnahmekriterien"}
  - {name: ticket, required: true, description: "Concept-Ticket mit Beschreibung, Kommentaren und Abhängigkeiten"}
  - {name: vault_context, required: true, description: "Verlinkte und thematisch nahe Obsidian-Seiten"}
  - {name: findings, required: false, description: "Befunde einer Konzeptprüfung, wenn das Konzept nachgebessert wird"}
preconditions: []
scope:
  within_work_order: true
  allowed: [read_repo, read_vault, run_checks, write_asana, write_vault]
  forbidden: [write_worktree, commit, push, open_pr, merge, start_agents, change_platform_limits]
result:
  format: concept_report
checks:
  - {id: context_read, description: "Ticket, verlinkte Seiten, Bestand und frühere Entscheidungen sind gelesen"}
  - {id: assumptions_checked, description: "Annahmen sind gegen echte Daten oder den Bestand geprüft, Aussagen mit Fundstelle belegt"}
  - {id: self_review, description: "Die Seite ist nach dem Schreiben erneut gelesen: Vollständigkeit, Widersprüche, Umsetzbarkeit, Links"}
  - {id: classified, description: "Das Konzept ist als routine oder strategisch eingestuft; Zweifel gelten als strategisch"}
blockers:
  - {id: open_decision, description: "Eine fachliche Entscheidung fehlt und ändert den Lösungsweg", result: concept_blocked}
  - {id: missing_access, description: "Zugang oder Daten fehlen, die das Konzept belegen müssen", result: concept_blocked}
completion_criteria:
  - "Die Obsidian-Seite ist versioniert und für Umsetzer ohne Rückfrage verwendbar"
  - "Die Einstufung routine oder strategisch ist festgehalten, mit den zutreffenden Kriterien"
  - "Abgeleitete Folgearbeit ist als Ticket beschrieben, ohne dass sie umgesetzt wurde"
  - "Offene Punkte sind benannt; ein strategisches Konzept gilt nicht als freigegeben"
results:
  concept_ready:
    followups:
      - {action: review, role: concept_reviewer}
      - {action: ask_question}
  concept_blocked:
    followups:
      - {action: ask_question}
