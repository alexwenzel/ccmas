# Workflow-Vertrag (schema_version 1). Aufbau und Prüfungen: docs/architecture/workflow-rules.md.
# Der Vertrag wählt aus den Rollenregeln (rules/roles.yaml) aus; er kann sie nicht erweitern und
# setzt weder Worker-Limit, Integrationsmodus, Policy-Profil, Berechtigungen noch Zielbranch.
schema_version: 1
skill: ccmas-concept-review
role: concept_reviewer
uses_skills: []
inputs:
  - {name: work_order, required: true, description: "Prüfauftrag mit Ziel und Akzeptanzkriterien des Konzepts"}
  - {name: concept_version, required: true, description: "Zu prüfende Konzeptversion (Seite und Version)"}
  - {name: goal, required: true, description: "Ziel und Abnahmekriterien, die das Konzept erfüllen soll"}
  - {name: rules, required: true, description: "Maßgebliche Regeln und festgelegte Produktentscheidungen"}
  - {name: author_execution_id, required: true, description: "Ausführung des Konzept-Agenten, zum Nachweis der Unabhängigkeit"}
preconditions: []
scope:
  within_work_order: true
  allowed: [read_repo, read_vault, run_checks]
  forbidden: [write_worktree, commit, push, open_pr, merge, write_asana, write_vault, start_agents, change_platform_limits]
result:
  format: review_report
checks:
  - {id: version_unique, description: "Die Konzeptversion ist eindeutig bestimmt und entspricht der angeforderten"}
  - {id: goal_covered, description: "Ziel, Umfang und Abnahmekriterien sind vollständig und widerspruchsfrei umgesetzt"}
  - {id: rules_respected, description: "Regeln, festgelegte Produktentscheidungen und frühere Entscheidungen werden eingehalten"}
  - {id: implementable, description: "Ein Implementierer könnte jedes abgeleitete Ticket ohne Rückfrage beginnen"}
  - {id: classified, description: "Das Konzept ist als routine oder strategisch eingestuft; Zweifel gelten als strategisch"}
  - {id: commit_is_reference, description: "Der Bericht bezieht sich auf die Konzeptversion; commit ist nur der Bezugsstand des Code-Repositorys (Stand develop zum Prüfzeitpunkt) und keine Freigabe von Code"}
blockers:
  - {id: version_not_unique, description: "Die Konzeptversion ist nicht eindeutig bestimmbar", result: concept_findings}
  - {id: strategic_or_unclear, description: "Das Konzept ist strategisch oder nicht ausreichend geklärt; es gibt keine Freigabe", result: needs_user_decision}
completion_criteria:
  - "Die Einstufung routine oder strategisch ist begründet festgehalten"
  - "Bei routine steht FREIGEGEBEN oder BEFUNDE für genau die geprüfte Konzeptversion"
  - "Bei strategisch oder ungeklärt gibt es keine Freigabe, sondern eine Empfehlung für den Nutzer mit Optionen"
  - "Es wurde nichts geändert; Befunde nennen Ort und erwartete Korrektur"
  - "Der Bericht bezieht sich auf die Konzeptversion; sein commit ist ein Bezugsstand und gibt keinen Code frei"
results:
  concept_approved:
    verdict: FREIGEGEBEN
    followups:
      - {action: plan_extend, role: supervisor, preconditions: [concept_version_approved]}
      - {action: implementation, role: implementer, preconditions: [concept_version_approved]}
  # Nach Befunden: Konzeptarbeit, danach neue Prüfung in frischer Ausführung. Dasselbe Reparaturbudget wie die
  # Code-Schleife (rules/roles.yaml, repair_loop.max_rounds); danach Halt mit Frage an den Nutzer.
  concept_findings:
    verdict: BEFUNDE
    followups:
      - {action: concept_work, role: concept}
  needs_user_decision:
    followups:
      - {action: ask_question}
