# Manifest des führenden CCMAS-Skillbestands (schema_version 1).
#
# Format, Statusbedeutung und Hash-Definitionen: docs/architecture/skill-migration.md.
# Prüfen mit `ccmas skills validate`. Jede Änderung an einer Skill-Datei erhöht `version`
# und zieht die Hashes hier nach (Datei: sha256 der Bytes; tree_sha256: sha256 über die
# sortierten Zeilen "<sha256>  <pfad>"). `source.package` ist vault-relativ und nur eine
# Inventarangabe; Go liest zur Laufzeit nie den Vault. Skills ohne Originalpaket (neu in CCMAS)
# tragen `package: none` und `package_sha256` aus 64 Nullen, nie eine erfundene Prüfsumme.
# `external_writes` ist ebenfalls nur Inventar für die späteren Adapter, keine Berechtigung.
# Workflow-Skills (Kategorien concept, review, delivery, completion, questions) haben zusätzlich
# `contract.yaml` (Datei des Skills, damit in Hash und Snapshot); Rollenregeln: rules/roles.yaml.
