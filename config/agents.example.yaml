# Beispiel für agents.yaml: Rollenprofile und individuelle Agenten. `ccmas profile init` kopiert
# diese Datei nach <Konfigurationsverzeichnis>/agents.yaml und überschreibt nie eine vorhandene
# Datei. Danach verwaltet ccmas die Datei (`ccmas profile set`, `ccmas agent set`); beim Schreiben
# gehen Kommentare verloren.
#
# Rangfolge je Feld (Modell, Effort, Skills einzeln): ausdrücklicher Auftragswert > individueller
# Agentenwert > Wahl des Supervisors > Rollenstandard. Alles nur innerhalb der Rollenerlaubnis:
#   allowed_models / allowed_efforts (optional; fehlt die Angabe, sind alle in models.yaml
#   konfigurierten erlaubt).
# skills: leer oder fehlend = Standardausstattung der Rolle aus dem Skill-Katalog.
# Keine Zugangsdaten in diese Datei schreiben.
schema_version: 1
revision: 1
roles:
  supervisor:
    runtime: claude
    model: claude-opus-5-5
    effort: high
    policy: readonly
  reviewer:
    runtime: claude
    model: claude-opus-5-5
    effort: high
    policy: readonly
  concept_reviewer:
    runtime: claude
    model: claude-opus-5-5
    effort: high
    policy: readonly
  implementer:
    runtime: claude
    model: claude-sonnet-5-5
    effort: high
    policy: scoped_write
  concept:
    runtime: claude
    model: claude-sonnet-5-5
    effort: high
    policy: readonly
  documentation:
    runtime: claude
    model: claude-sonnet-5-5
    effort: medium
    policy: readonly
  project_setup:
    runtime: claude
    model: claude-sonnet-5-5
    effort: high
    policy: readonly
  completion:
    runtime: claude
    model: claude-sonnet-5-5
    effort: high
    policy: readonly
  question_handler:
    runtime: claude
    model: claude-sonnet-5-5
    effort: high
    policy: readonly
# Individuelle Agenten (Beispiel; `ccmas agent set` legt sie an):
# agents:
#   impl-schwer:
#     role: implementer
#     model: claude-opus-5-5
#     effort: xhigh
agents: {}
