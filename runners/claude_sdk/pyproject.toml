[project]
name = "claude_sdk_runner"
version = "0.1.0"
description = "Schlanker Python-Runner: verbindet den Go-Dienst von CCMAS mit dem offiziellen Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    # Offizielles Claude Agent SDK (PyPI), exakt gepinnt. Siehe docs/architecture/ccmas-design.md.
    "claude-agent-sdk==0.2.180",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
